name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate repository structure
        run: |
          test -d RaceDay.API
          test -d RaceDay.API.Tests
          test -d RaceDay.MVC
          test -f README.md
          test -f RaceDay.MVC/Dockerfile

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore RaceDay.sln

      - name: Build API, tests and MVC
        run: dotnet build RaceDay.sln --no-restore -c Release

      - name: Run unit tests
        run: dotnet test RaceDay.sln --no-build -c Release --verbosity normal

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build MVC Docker image
        run: docker build -t raceday-mvc ./RaceDay.MVC
      - name: Build API Docker image
        run: docker build -t raceday-api ./RaceDay.API
